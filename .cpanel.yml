---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/winzonep/bothive
    - /usr/bin/rsync -av --delete --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='*.dump' --exclude='*.sql' ./ $DEPLOYPATH
    - /usr/local/bin/node /usr/local/bin/npm install --prefix $DEPLOYPATH
    - /usr/local/bin/node /usr/local/bin/npm run build --prefix $DEPLOYPATH