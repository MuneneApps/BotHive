<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .spin { animation: spinLogo 1.6s linear infinite; transform-origin: 60px 60px; }
    @keyframes spinLogo {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <g class="spin">
    <polygon points="60,8 104,32 104,80 60,104 16,80 16,32"
             fill="#0f3460" stroke="#1e3a5f" stroke-width="1.5"/>
    <polygon points="60,8 104,32 82,32 60,18" fill="#6ec45a" opacity="0.95"/>
    <polygon points="104,32 104,80 82,68 82,32" fill="#2ab4b4" opacity="0.95"/>
    <polygon points="104,80 60,104 38,90 82,68" fill="#1a8f8f" opacity="0.9"/>
    <polygon points="60,8 60,18 38,32 16,32" fill="#1a3a6a" opacity="0.85"/>
    <polygon points="16,32 38,32 38,90 16,80" fill="#162d55" opacity="0.85"/>
    <polygon points="60,26 80,37 80,59 60,70 40,59 40,37"
             fill="#0d2444" stroke="#2ab4b4" stroke-width="1"/>
    <polygon points="60,38 70,44 70,56 60,62 50,56 50,44" fill="#2ab4b4"/>
    <circle cx="60" cy="50" r="6" fill="#38d4d4"/>
  </g>
</svg>
